name: Monitoraggio Adriatico
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Interroga Global Fishing Watch
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: python monitor.py
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica la mappa
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica la mappa
        id: deploy
        uses: actions/deploy-pages@v4
